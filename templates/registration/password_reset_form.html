{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- Banner Section -->
<div class="position-relative text-white text-center py-5"
     style="background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), url('{% static "images/hero-bg.jpg" %}') center/cover no-repeat; padding: 80px 0 !important;">
  <div class="container py-4">
    <h1 class="fw-normal display-4 mb-2">Password Reset</h1>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb justify-content-center mb-0 text-white-50 fs-6">
        <li class="breadcrumb-item"><a href="#" class="text-white-50 text-decoration-none">Home</a></li>
        <li class="breadcrumb-item active text-white" aria-current="page">Password reset</li>
      </ol>
    </nav>
  </div>
</div>

<!-- Main Form Section -->
<div class="container my-5 py-4">
  <div class="row">
    <div class="col-12 col-md-6 col-lg-5">
      <h3 class="fw-normal mb-3 text-secondary">Forgot Password</h3>
      <hr class="mb-4 text-muted" style="opacity: 0.15;">

      <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
          <label for="email" class="form-label text-secondary fs-6 mb-2">Email:</label>
          <input type="email"
                 class="form-control rounded-0 shadow-none"
                 id="email"
                 name="email"
                 required
                 style="border-color: #f59e0b; padding: 0.6rem 0.75rem;">
        </div>

        <button type="submit"
                class="btn text-dark fw-bold w-100 rounded-0 py-2 border-0"
                style="background-color: #ffb703; letter-spacing: 0.5px; font-size: 0.85rem;">
          SEND CONFIRMATION LINK
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
